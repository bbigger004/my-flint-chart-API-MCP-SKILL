<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Flint 编译管线</title>
  <style>
    :root {
      --bg: #0a0f1a;
      --panel: #101a2b;
      --line: #2c3c5a;
      --line-soft: #1d2a42;
      --ink: #e9f1fb;
      --muted: #92a4bd;
      --cyan: #4cc3ff;
      --lime: #b8ef61;
      --amber: #ffc966;
      --rose: #ff7d8f;
      --mono: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden;
      background: var(--bg); color: var(--ink); font-family: var(--sans); }
    svg { display: block; }
    .kicker { fill: var(--muted); font-family: var(--mono); font-size: 22px; letter-spacing: .22em; }
    .h1 { fill: var(--ink); font-size: 52px; font-weight: 800; }
    .sub { fill: var(--muted); font-size: 22px; }
    .step { fill: var(--panel); stroke: var(--line); }
    .step-accent { fill: #0c1830; stroke: #2f6dff; }
    .badge { font-family: var(--mono); font-size: 18px; font-weight: 800; }
    .h2 { fill: var(--ink); font-size: 23px; font-weight: 750; }
    .text { fill: var(--muted); font-size: 18px; }
    .code { fill: var(--lime); font-family: var(--mono); font-size: 18px; }
    .arrow { stroke: var(--cyan); stroke-width: 4; fill: none; }
    .arrow-soft { stroke: var(--line); stroke-width: 3; fill: none; }
  </style>
</head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="Flint 编译管线图">
  <defs>
    <marker id="p" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#4cc3ff"/>
    </marker>
  </defs>

  <text x="80" y="90" class="kicker">COMPILER PIPELINE / FLINT-JS CORE</text>
  <text x="80" y="154" class="h1">Flint 编译管线：意图 → 决策 → 布局 → 主题 → 原生 spec</text>
  <text x="80" y="206" class="sub">声明式输入只回答“字段含义 + 想画什么”，其余视觉工程由编译器按数据量与画布预算自动推导</text>

  <!-- 输入 -->
  <rect x="80" y="270" width="400" height="520" rx="18" class="step-accent"/>
  <text x="112" y="318" class="badge" style="fill:#4cc3ff">INPUT</text>
  <text x="112" y="360" class="h2">ChartAssemblyInput</text>
  <text x="112" y="400" class="code">data</text>
  <text x="112" y="430" class="text">行数据 values / url</text>
  <text x="112" y="470" class="code">semantic_types</text>
  <text x="112" y="500" class="text">字段业务含义：YearMonth、Amount…</text>
  <text x="112" y="540" class="code">chart_spec</text>
  <text x="112" y="570" class="text">图表类型 + 视觉通道绑定</text>
  <text x="112" y="610" class="code">theme_spec（可选）</text>
  <text x="112" y="640" class="text">预设名 / ThemeSpec / extends 继承</text>
  <text x="112" y="680" class="code">options / baseSize</text>
  <text x="112" y="710" class="text">画布尺寸、行为开关</text>

  <!-- 阶段1 -->
  <rect x="560" y="270" width="310" height="240" rx="18" class="step"/>
  <text x="592" y="318" class="badge cyan">STAGE 01</text>
  <text x="592" y="358" class="h2">语义解析与规范化</text>
  <text x="592" y="398" class="text">resolve-semantics</text>
  <text x="592" y="426" class="text">type-registry · field-semantics</text>
  <text x="592" y="454" class="text">normalize-properties</text>
  <text x="592" y="482" class="text">图表模板与通道校验</text>

  <!-- 阶段2 -->
  <rect x="560" y="550" width="310" height="240" rx="18" class="step"/>
  <text x="592" y="598" class="badge cyan">STAGE 02</text>
  <text x="592" y="638" class="h2">自动决策</text>
  <text x="592" y="678" class="text">轴：0 起点 / log / 离散弹性</text>
  <text x="592" y="706" class="text">刻度、格式化、单位</text>
  <text x="592" y="734" class="text">配色：发散 / 连续 / 分类</text>
  <text x="592" y="762" class="text">编码覆盖与默认标记</text>

  <!-- 阶段3 -->
  <rect x="940" y="270" width="330" height="240" rx="18" class="step"/>
  <text x="972" y="318" class="badge cyan">STAGE 03</text>
  <text x="972" y="358" class="h2">布局与安全</text>
  <text x="972" y="398" class="text">compute-layout</text>
  <text x="972" y="426" class="text">aggregate / pivot / static-series</text>
  <text x="972" y="454" class="text">band-dodge · chart-transitions</text>
  <text x="972" y="482" class="text">标签自适应旋转/截断</text>

  <rect x="940" y="550" width="330" height="240" rx="18" class="step"/>
  <text x="972" y="598" class="badge cyan">STAGE 04</text>
  <text x="972" y="638" class="h2">溢出与主题</text>
  <text x="972" y="678" class="text">filter-overflow → _warnings</text>
  <text x="972" y="706" class="text">theme presets / merge / overrides</text>
  <text x="972" y="734" class="text">字族字号、网格、标记几何</text>
  <text x="972" y="762" class="text">图例 / 标签 / 注释策略</text>

  <!-- 阶段5 -->
  <rect x="1350" y="270" width="490" height="520" rx="18" class="step-accent"/>
  <text x="1382" y="318" class="badge" style="fill:#b8ef61">STAGE 05 · ASSEMBLE</text>
  <text x="1382" y="360" class="h2">后端原生 spec</text>
  <text x="1382" y="402" class="code">assembleVegaLite</text>
  <text x="1382" y="430" class="text">主题最完整 · 前端编辑器首选</text>
  <text x="1382" y="470" class="code">assembleECharts</text>
  <text x="1382" y="498" class="text">Sunburst / Sankey / Treemap…</text>
  <text x="1382" y="538" class="code">assembleChartjs</text>
  <text x="1382" y="566" class="text">轻量小部件</text>
  <text x="1382" y="606" class="code">assemblePlotly</text>
  <text x="1382" y="634" class="text">Funnel / Gauge / Geo…</text>
  <text x="1382" y="674" class="code">assembleExcel</text>
  <text x="1382" y="702" class="text">Office.js 原生可编辑图表</text>
  <text x="1382" y="748" class="h2">输出对象</text>
  <text x="1382" y="784" class="text">目标库 spec / option / figure</text>

  <!-- 底部 -->
  <rect x="80" y="850" width="1760" height="170" rx="18" class="step"/>
  <text x="112" y="898" class="h2">可靠性护栏（仓库内）</text>
  <text x="112" y="940" class="text">模板注册表与通道注册表 · validate 工具 · chart-properties-validation</text>
  <text x="112" y="972" class="text">repo 内数百个单测（theme / backend / sizing / overflow / excel …）+ 跨后端一致性检查</text>
  <text x="112" y="1004" class="text">Agent 侧：flint-chart-author / flint-theme-author 技能指导选题与改主题</text>

  <!-- 箭头 -->
  <path d="M480 530 L560 530" class="arrow" marker-end="url(#p)"/>
  <path d="M715 510 V550" class="arrow" marker-end="url(#p)"/>
  <path d="M870 540 L940 540" class="arrow" marker-end="url(#p)"/>
  <path d="M1105 510 V550" class="arrow" marker-end="url(#p)"/>
  <path d="M1270 560 L1350 560" class="arrow" marker-end="url(#p)"/>

  <text x="80" y="1058" class="sub" style="font-size:19px">Stage 01–04 是本仓库 repo/packages/flint-js/src/core 与各后端目录的实现范围；Stage 05 暴露为同一 input 的 5 个纯函数。</text>
</svg>
</body>
</html>
